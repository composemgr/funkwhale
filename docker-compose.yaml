# nginx proxy address - http://172.17.0.1:8081

name: funkwhale
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  app:
    image: funkwhale/all-in-one:latest
    pull_policy: always
    container_name: funkwhale-app
    restart: always
    logging: *default-logging
    networks:
      - funkwhale
    ports:
      - "172.17.0.1:8081:80"
    environment:
      TZ: ${TZ:-America/New_York}
      FUNKWHALE_HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      FUNKWHALE_PROTOCOL: http
      DJANGO_SECRET_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgresql://${DB_USER_NAME:-funkwhale}:${DB_USER_PASS:-changeme_db_password}@funkwhale-db:5432/${DB_CREATE_DATABASE_NAME:-funkwhale}
      CACHE_URL: redis://funkwhale-redis:6379/0
      EMAIL_CONFIG: smtp+tls://${EMAIL_SERVER_USER:-}:${EMAIL_SERVER_PASS:-}@${EMAIL_SERVER_HOST:-172.17.0.1}:${EMAIL_SERVER_PORT:-587}
      DEFAULT_FROM_EMAIL: ${EMAIL_SERVER_MAIL_FROM:-noreply@example.com}
      FUNKWHALE_ADMIN_USERNAME: ${APP_ADMIN_USER:-admin}
      FUNKWHALE_ADMIN_EMAIL: ${EMAIL_SERVER_MAIL_FROM:-admin@example.com}
      FUNKWHALE_ADMIN_PASSWORD: ${APP_ADMIN_PASS:-changeme_admin_password}
      MUSIC_DIRECTORY_PATH: /music
      MEDIA_ROOT: /data/media
      STATIC_ROOT: /data/static
    volumes:
      - ./volumes/data/funkwhale:/data
      - ./volumes/music/funkwhale:/music:ro
    depends_on:
      - funkwhale-db
      - funkwhale-redis

  funkwhale-db:
    image: postgres:latest
    pull_policy: always
    container_name: funkwhale-db
    restart: always
    logging: *default-logging
    networks:
      - funkwhale
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-funkwhale}
      POSTGRES_USER: ${DB_USER_NAME:-funkwhale}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - ./volumes/data/db/postgres/funkwhale:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_NAME:-funkwhale} -d ${DB_CREATE_DATABASE_NAME:-funkwhale}"]
      interval: 30s
      timeout: 10s
      retries: 3

  funkwhale-redis:
    image: redis:alpine
    pull_policy: always
    container_name: funkwhale-redis
    restart: always
    logging: *default-logging
    networks:
      - funkwhale
    volumes:
      - ./volumes/data/redis/funkwhale:/data

networks:
  funkwhale:
    name: funkwhale
    external: false
